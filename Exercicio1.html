<body>

    <script>

        var n1 = parseInt(prompt("Digite um numero inteiro: "))

        if (n1 % 2 == 0){

            alert (n1 + " é um numero par! ")
        }
        
        else {

            alert (n1 + " é um numero impar! ")
        }

       
    
        






    </script>
