<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        var n1 = parseFloat(prompt("Digite o Primeiro numero: "))
        var n2 = parseFloat(prompt("Digite o Segundo numero: "))
        var n3 = parseFloat(prompt("Digite o Terceiro numero: "))

        if (n1 == n2 && n1 == n3){

            alert("Os tres sao iguais: " + n1 + " | " + n2 + " | " + n3)
        }

        else if (n1 == n2){

            alert ("Os dois primeiros sao iguais: "  + n1 + " | " + n2 + " | " + n3)
        }

        else if (n2 == n3){

            alert("O segundo e o terceiro sao iguais: "  + n1 + " | " + n2 + " | " + n3)

        }

        else if (n1 == n3){

            alert("O primeiro e o ultimo sao iguais: "  + n1 + " | " + n2 + " | " + n3)
        }

       
        else if (n1 > n2 && n1 > n3 ){

            alert("O primeiro é o maior: " + n1 + " | " + n2 + " | " + n3)

        }

        else if (n2 > n1 && n2 > n3 ) {

            alert("O segundo é o maior: " + n1 + " | " + n2 + " | " + n3)

        }

        else if (n3 > n2 && n3 > n1 ) {

            alert("O terceiro é o maior: " + n1 + " | " + n2 + " | " + n3)
        }



        












    </script>
    
</body>
</html>
