<body>
    
    <script>

        var n1 = parseInt(prompt("Digite um numero inteiro e positivo: "))
    if (n1 == 2 || n1 == 3 || n1 == 5){
        alert("O numero é primo!")
    }
    else if (n1 % 2 == 0 || n1 % 3 == 0 || n1 % 5 == 0){

        alert("O numero não é primo!")
    }
    else {alert ("O numero é primo!")}

        
    



    </script>
    
</body>
</html>
