<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>


var n1 = parseFloat(prompt("Digite um numero: "))

if(n1 < 0){

    alert ("Não é possivel com numero negativo!")

}

else {

    var contagem = 0
    for(var i = 1; i<=n1; i++){

          contagem += i;
    }
   
     alert("Contagem: " + contagem)
    


}




        





    </script>
    
</body>
</html>
