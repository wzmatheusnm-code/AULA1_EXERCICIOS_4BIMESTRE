<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        var n = parseFloat(prompt("Digite um numero: "))

        if (n < 0){

            alert ("O numero e negativo: " +  n)
        }

        else if (n > 0){

            alert ("O numero e positivo: " + n)
        }

        else if (n == 0){

            alert ("O numero e igual a 0")




        }

    



    </script>
    
</body>
</html>
